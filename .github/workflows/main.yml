name: Test and Release

on:
  push:
    branches: ['**']
    tags: ['v[0-9]*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gjs libglib2.0-bin make

      - name: Run unit tests
        run: make test

  release:
    name: Build and publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext libglib2.0-bin make zip

      - name: Build extension package
        run: make zip

      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install shexli
        run: python -m pip install shexli

      - name: Check extension package
        run: shexli vitals.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" vitals.zip --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
