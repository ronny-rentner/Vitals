name: Feature Request
description: Please read the documentation before submitting!
labels: ["feature"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the [documentation](https://github.com/ronny-rentner/Vitals/blob/catalog-rewrite/README.md) before submitting a feature request.
  - type: checkboxes
    attributes:
      label: Is this covered in the documentation?
      options:
      - label: I have read the documentation and my issue is not covered.
        required: true
  - type: checkboxes
    attributes:
      label: Is there an existing issue reported already?
      options:
      - label: I have searched the existing issues, it does not exist.
        required: true
  - type: textarea
    id: feature-desc
    attributes:
      label: Describe the new feature you would like
      placeholder: A clear and concise description of what you want to happen.
    validations:
      required: true
