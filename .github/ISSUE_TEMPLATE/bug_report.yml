name: Bug Report
description: Please read the documentation before submitting!
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please read the [documentation](https://github.com/ronny-rentner/Vitals/blob/catalog-rewrite/README.md) before submitting a bug report.
  - type: checkboxes
    attributes:
      label: Is this covered in the documentation?
      options:
      - label: I have read the documentation and my issue is not covered.
        required: true
  - type: checkboxes
    attributes:
      label: Is there an existing issue reported already?
      options:
      - label: I have searched the existing issues, it does not exist.
        required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What is the unexpected behavior?
      placeholder: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce the unexpected behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Run `journalctl -f -o cat /usr/bin/gnome-shell`, reproduce the problem, and paste the relevant output. It will be formatted as code; no backticks needed.
      render: shell
  - type: input
    id: distro-type
    attributes:
      label: What distribution and version of Linux are you using?
      placeholder: Distribution name and version from /etc/os-release
    validations:
      required: true
  - type: input
    id: gnome-version
    attributes:
      label: What version of GNOME Shell are you using?
      placeholder: Output of gnome-shell --version
    validations:
      required: true
